[build-system]
requires = ["uv-build==0.13.6"]
build-backend = "uv_build"

[project]
name = "service-tracker-server"
version = "0.1.0"
requires-python = "~=3.15.0"
dependencies = [
  "cryptography~=50.0.0",
  "fastapi~=0.162.0",
  "granian[reload]~=2.8.0",
  "otpauth~=2.2.1",
  "qrcode~=8.2",
  "sqlmodel~=0.0.38",
]

[project.scripts]
service-tracker-server = "service_tracker_server.__main__:main"
